plugins {
    id 'com.android.application'
}

// the version of all players (src/player-ui/VERSION): in the repository v2.0.0 or v2.0.0-dev (the v is optional), the CD
// appends the build number, v2.0.0.997 or v2.0.0-dev.996. Android updates by the versionCode only, so a release needs
// that number: without it the versionCode would lie below the dev builds and Android would refuse the release as an
// update.
def playerVersion = file('../../VERSION').readLines().first().trim()
def stamped       = playerVersion =~ /^v?\d+\.\d+\.\d+(-[0-9A-Za-z]+)?\.(\d+)$/
def build         = stamped.matches() ? stamped.group(2).toInteger() : 1 // 1: a local build without the CD
gradle.taskGraph.whenReady { graph ->
    if (!stamped.matches() && graph.allTasks.any { it.name.toLowerCase().contains('release') })
        throw new GradleException("VERSION '$playerVersion' has no build number (v2.0.0.997, v2.0.0-dev.996): " +
                                  'a release would get a versionCode below the dev builds')
}

android {
    namespace 'com.sagiadinos.garlic.player'
    compileSdk 34

    defaultConfig {
        // the package of the earlier players, so an installed player keeps its settings and uuid
        applicationId 'com.sagiadinos.garlic.player'
        minSdk 25        // Android 7.1.1
        targetSdk 29     // the shared storage with WRITE_EXTERNAL_STORAGE also on Android 11+, like the earlier players
        versionCode 20000000 + build
        versionName playerVersion
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true // the .so files extracted, also on Android 7
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.annotation:annotation:1.8.2"
}
