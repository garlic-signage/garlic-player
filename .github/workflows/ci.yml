# Tests of the core in Debian Trixie with line coverage. On master the coverage badge is committed to the branch
# "badges" (an SVG made here, no external service); the README shows it from there.
# The builds of the old player on the own runners are in build.yml.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Core tests (Debian Trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write # the badge goes to the branch "badges"

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ pkg-config python3 gcovr tzdata \
            libcurl4-openssl-dev libmicrohttpd-dev libsqlite3-dev libxml2-dev nlohmann-json3-dev doctest-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S src/core -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGARLIC_CORE_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS=--coverage
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
          -DCMAKE_SHARED_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/core/' --exclude 'src/core/tests/' \
                --txt --html-details coverage/index.html --json-summary coverage/summary.json build
          python3 .github/scripts/coverage_badge.py coverage/summary.json coverage/coverage.svg

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Commit badge to the branch badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          badges=$(mktemp -d)
          cd "$badges"
          git init -q -b badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # the first run creates the branch without history; later ones continue it
          if git fetch -q --depth 1 origin badges; then git checkout -q -B badges FETCH_HEAD; fi
          cp "$GITHUB_WORKSPACE/coverage/coverage.svg" .
          git add coverage.svg
          if git diff --cached --quiet; then echo "badge unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -q origin badges
